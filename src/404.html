<!doctype html>
<html lang="en" class="scrollbar-thumb-faint scrollbar-track-transparent">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preload" href="/fonts/calibre-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/calibre-regular-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/calibre-semibold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/calibre-semibold-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/calibre-bold.woff2" as="font" type="font/woff2" crossorigin />
    <title>404 • Braden Roth</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body
    data-page="404"
    class="bg-white text-stone-800 antialiased dark:bg-zinc-950 dark:text-zinc-100"
  >
    <div id="wrapper">
      <main
        id="main"
        class="page-404 mx-auto w-full max-w-(--max-width) px-(--horizontal-padding) pb-(--bottom-padding) [--bottom-padding:calc(var(--vertical-padding)*2)] [--vertical-padding:--spacing(12)]"
      >
        <section class="page-404__hero pt-[calc(var(--vertical-padding)*3)]">
          <h1 class="page-404__numeral">404</h1>

          <p class="page-404__intro">
            Well, this is awkward&hellip; The page you’re looking for doesn’t exist. It may have been
            removed, renamed, or simply imagined.
          </p>

          <p class="page-404__body">
            If you were looking for a blog post, below are some of my most recent ones. For anything
            else, you can always <a href="/" class="external-link">head back home</a>.
          </p>
        </section>

        <hr class="page-404__rule my-(--vertical-padding)" />

        <section id="writing">
          <ul class="blog-post-list">
            {{recentPosts}}
          </ul>
          <div class="mt-4 text-sm font-medium">
            <a href="/blog" class="external-link">All Writings</a>
          </div>
        </section>
      </main>

      <div id="footer"></div>
    </div>
  </body>
</html>

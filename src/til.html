<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TIL • Braden Roth</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/blog.css" />
    <link rel="stylesheet" href="/til.css" />

    <!-- Basic Open Graph -->
    <meta property="og:title" content="TIL • Braden Roth" />
    <meta
      property="og:description"
      content="Full-stack developer building useful, meaningful, and delightful web applications."
    />
    <meta property="og:image" content="https://bradenroth.com/images/family.webp" />
    <meta property="og:url" content="https://bradenroth.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TIL • Braden Roth" />
    <meta
      name="twitter:description"
      content="Full-stack developer building useful, meaningful, and delightful web applications."
    />
    <meta name="twitter:image" content="https://bradenroth.com/images/family.webp" />
  </head>
  <body
    data-page="til-index"
    class="bg-white text-stone-800 antialiased dark:bg-zinc-950 dark:text-stone-100 dark:selection:bg-primary-500/40"
  >
    <div id="wrapper">
      <main id="main" class="prose prose--narrow">
        <header class="til-header">
          <h1>TIL<span class="text-accent">.</span></h1>
          <p>Things I didn’t know yesterday but thought were worth sharing today.</p>
        </header>

        <div class="til-list" data-timeline>
          <span class="til-list__dot" data-timeline-dot aria-hidden="true"></span>
          <ol class="til-list__items">
            {{tilList}}
          </ol>
        </div>
      </main>

      <div id="nav"></div>
      <div id="footer"></div>
    </div>
  </body>
</html>

<li class="til-item relative" data-timeline-entry id="{{domId}}">
  <time datetime="{{datetime}}" class="til-item__date">{{datetime}}</time>
  <a href="{{href}}">
    <h2 class="til-item__title">{{titleHtml}}</h2>
  </a>
  {{content}}
  <a class="blanket-link" href="{{href}}">
    <span class="sr-only">View "{{titleHtml}}"</span>
  </a>
</li>
